<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Gradient descent on a nonconvex loss curve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#7ef0ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1000" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="999" height="319" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <text x="48" y="78" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="300" fill="#f2f4f8" letter-spacing=".5">Mathematics of machine learning</text>
  <text x="50" y="108" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b93a3" letter-spacing="3">OPTIMISATION  ·  LOSS LANDSCAPES  ·  GENERALISATION</text>

  <path id="p" pathLength="1" d="M 40 175 C 140 175, 190 270, 300 272 C 380 274, 400 215, 470 212 C 540 209, 560 262, 650 284 C 740 306, 800 200, 960 150"
        fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <path pathLength="1" d="M 40 175 C 140 175, 190 270, 300 272 C 380 274, 400 215, 470 212 C 540 209, 560 262, 650 284 C 740 306, 800 200, 960 150"
        fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0.31;0.31;1" keyTimes="0;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <g>
    <circle r="16" fill="url(#glow)"/>
    <circle r="5.5" fill="#e9fdff"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.69;0.69;0" keyTimes="0;0.7;0.92;1" rotate="0">
      <mpath href="#p"/>
    </animateMotion>
  </g>
  <text x="300" y="305" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b93a3" letter-spacing="1.5" opacity="0">local minimum
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="675" y="305" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b93a3" letter-spacing="1.5" opacity="0">global minimum
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.65;0.9;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="952" y="52" text-anchor="end" font-family="'Cambria Math','Latin Modern Math',Georgia,serif" font-size="20" fill="#5b6cff" fill-opacity=".9" font-style="italic">θ ← θ − η ∇L(θ)</text>
</svg>
